name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/')"
          if [ "${TAG_VERSION}" != "${CRATE_VERSION}" ]; then
            echo "::error::tag 版本 (${TAG_VERSION}) 与 Cargo.toml 版本 (${CRATE_VERSION}) 不一致"
            exit 1
          fi
          echo "准备发布版本 ${CRATE_VERSION}"

      - name: Publish (dry-run)
        run: cargo publish --dry-run --registry crates-io

      - name: Publish to crates.io
        run: cargo publish --registry crates-io --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
