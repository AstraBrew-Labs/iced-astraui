name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 0.0.3），留空则直接使用 Cargo.toml 中的版本'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/')"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${CRATE_VERSION}" ]; then
              echo "::error::tag 版本 (${TAG_VERSION}) 与 Cargo.toml 版本 (${CRATE_VERSION}) 不一致"
              exit 1
            fi
          else
            INPUT_VERSION="${{ github.event.inputs.version }}"
            if [ -n "${INPUT_VERSION}" ] && [ "${INPUT_VERSION}" != "${CRATE_VERSION}" ]; then
              echo "::error::手动指定的版本 (${INPUT_VERSION}) 与 Cargo.toml 版本 (${CRATE_VERSION}) 不一致"
              exit 1
            fi
          fi
          echo "准备发布版本 ${CRATE_VERSION}"

      - name: Publish (dry-run)
        run: cargo publish --dry-run --registry crates-io

      - name: Publish to crates.io
        run: cargo publish --registry crates-io --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
