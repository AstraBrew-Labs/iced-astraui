[package]
name = "astra-ui"
version = "0.1.0"
edition = "2024"
description = "Iced UI library for AstraBrew-Labs"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio"] }
lucide-icons = { version = "1.31.0", features = ["iced"] }

[profile.release]
lto = "thin"
strip = true
