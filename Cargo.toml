[package]
name = "astrabrew-launcher-mac"
version = "0.1.0"
edition = "2024"
description = "Native macOS launcher for AstraBrew-Labs"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
lucide-icons = { version = "1.31.0", features = ["iced"] }

[profile.release]
lto = "thin"
strip = true
